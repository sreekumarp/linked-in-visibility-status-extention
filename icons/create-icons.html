<!DOCTYPE html>
<html>
  <head>
    <title>Create Extension Icons</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }
      canvas {
        border: 1px solid #ccc;
        margin: 10px;
      }
    </style>
  </head>
  <body>
    <h1>LinkedIn Visibility Extension Icons</h1>
    <p>Right-click on each icon and "Save image as" to save the PNG files:</p>

    <h3>16x16 Icon:</h3>
    <canvas id="icon16" width="16" height="16"></canvas>

    <h3>48x48 Icon:</h3>
    <canvas id="icon48" width="48" height="48"></canvas>

    <h3>128x128 Icon:</h3>
    <canvas id="icon128" width="128" height="128"></canvas>

    <button onclick="downloadCanvas('icon16', 'icon16.png')">
      Download 16x16 Icon
    </button>
    <button onclick="downloadCanvas('icon48', 'icon48.png')">
      Download 48x48 Icon
    </button>
    <button onclick="downloadCanvas('icon128', 'icon128.png')">
      Download 128x128 Icon
    </button>

    <script>
      function createIcon(canvasId, size) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext("2d");

        // LinkedIn blue background
        ctx.fillStyle = "#0a66c2";
        ctx.fillRect(0, 0, size, size);

        // White eye icon
        ctx.fillStyle = "white";
        ctx.font = `${size * 0.6}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("👁️", size / 2, size / 2);
      }

      // Create all three icon sizes
      createIcon("icon16", 16);
      createIcon("icon48", 48);
      createIcon("icon128", 128);

      // Convert canvases to downloadable images
      function downloadCanvas(canvasId, filename) {
        const canvas = document.getElementById(canvasId);
        const link = document.createElement("a");
        link.download = filename;
        link.href = canvas.toDataURL();
        link.click();
      }

      // Add download links
    </script>
  </body>
</html>
