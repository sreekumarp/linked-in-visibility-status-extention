<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      min-height: 200px;
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f8f9fa;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #0a66c2;
    }
    
    .status-container {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
    }
    
    .current-status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    .status-icon {
      font-size: 24px;
      width: 32px;
      text-align: center;
    }
    
    .status-text {
      flex: 1;
      font-weight: 500;
      color: #333;
    }
    
    .status-description {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
    
    .actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #0a66c2;
      border-radius: 4px;
      background: white;
      color: #0a66c2;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: #0a66c2;
      color: white;
    }
    
    .btn.primary {
      background: #0a66c2;
      color: white;
    }
    
    .btn.primary:hover {
      background: #004182;
    }
    
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
    }
    
    .error {
      color: #cc1016;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>LinkedIn Visibility Status</h1>
  </div>
  
  <div class="status-container">
    <div class="current-status">
      <div class="status-icon" id="statusIcon">⏳</div>
      <div class="status-text" id="statusText">Loading...</div>
    </div>
    <div class="status-description" id="statusDescription">
      Checking your current profile visibility setting...
    </div>
  </div>
  
  <div class="actions">
    <button class="btn" id="refreshBtn">Refresh</button>
    <button class="btn primary" id="settingsBtn">Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
