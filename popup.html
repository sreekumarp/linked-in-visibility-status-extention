<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      min-height: 240px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f8f9fa;
      overflow-x: hidden;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      margin: 0;
      font-size: 18px;
      color: #0a66c2;
    }
    
    .status-container {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
    }
    
    .current-status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    
    .status-icon {
      font-size: 24px;
      width: 32px;
      text-align: center;
    }
    
    .status-text {
      flex: 1;
      font-weight: 500;
      color: #333;
    }
    
    .status-description {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
    
    .actions {
      display: flex;
      gap: 8px;
    }
    
    .btn {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #0a66c2;
      border-radius: 4px;
      background: white;
      color: #0a66c2;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn:hover {
      background: #0a66c2;
      color: white;
    }
    
    .btn.primary {
      background: #0a66c2;
      color: white;
    }
    
    .btn.primary:hover {
      background: #004182;
    }
    
    .loading {
      text-align: center;
      color: #666;
      font-style: italic;
    }
    
    .error {
      color: #cc1016;
      font-size: 12px;
      text-align: center;
    }

    .settings-container {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
      display: none;
    }

    .settings-container.visible {
      display: block;
    }

    .settings-title {
      font-weight: 600;
      margin-bottom: 12px;
      color: #333;
    }

    .setting-option {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .setting-option:hover {
      background: #f5f5f5;
    }

    .setting-option input[type="radio"] {
      margin-right: 8px;
    }

    .setting-option label {
      cursor: pointer;
      font-size: 14px;
      color: #333;
    }

    .setting-description {
      font-size: 11px;
      color: #666;
      margin-left: 20px;
      margin-top: 4px;
    }

    .back-to-status {
      color: #0a66c2;
      cursor: pointer;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .back-to-status:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>LinkedIn Visibility Status</h1>
  </div>
  
  <div class="status-container" id="statusContainer">
    <div class="current-status">
      <div class="status-icon" id="statusIcon">⏳</div>
      <div class="status-text" id="statusText">Loading...</div>
    </div>
    <div class="status-description" id="statusDescription">
      Checking your current profile visibility setting...
    </div>
  </div>

  <div class="settings-container" id="settingsContainer">
    <div class="back-to-status" id="backToStatus">← Back to Status</div>
    <div class="settings-title">Display Mode</div>
    
    <div class="setting-option" id="toggleModeOption">
      <input type="radio" id="toggleMode" name="iconMode" value="toggle">
      <label for="toggleMode">Toggle one by one</label>
    </div>
    <div class="setting-description">Shows a single icon that cycles through all 3 modes when clicked</div>
    
    <div class="setting-option" id="allIconsOption">
      <input type="radio" id="allIconsMode" name="iconMode" value="all">
      <label for="allIconsMode">Show all icons</label>
    </div>
    <div class="setting-description">Shows all 3 icons with the current mode highlighted. Click any icon to switch to that mode.</div>
  </div>
  
  <div class="actions" id="statusActions">
    <button class="btn" id="refreshBtn">Refresh</button>
    <button class="btn primary" id="optionsBtn">Options</button>
  </div>

  <div class="actions" id="settingsActions" style="display: none;">
    <button class="btn" id="applySettingsBtn">Apply & Close</button>
    <button class="btn primary" id="linkedinSettingsBtn">LinkedIn Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
